# Link check: every link on the published site, internal and external.
# Runs on each pull request and push to main, and weekly, because the VA and ODU pages
# the kit cites move without notice. Bot-blocking answers (403, 429) count as reachable.
name: links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 7:17 AM ET (11:17 UTC, EDT)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --max-retries 3
            --timeout 30
            --remap 'https://ferrelldevin.github.io/veteran-resources/(.*) file://${{ github.workspace }}/$1'
            --index-files index.html
            --exclude-path .git
            '**/*.html'
          fail: false
      - name: List each dead link as an annotation
        if: steps.lychee.outputs.exit_code != 0
        run: grep -E '^\s*\* \[' lychee/out.md | head -50 | while IFS= read -r l; do echo "::error title=dead link::$l"; done
      - name: Open an issue when the weekly run finds a dead link
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead link found by the weekly check"
          content-filepath: ./lychee/out.md
          labels: links
      - name: Fail the run on a dead link (pull requests and pushes)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'schedule'
        run: exit 1
